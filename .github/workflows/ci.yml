name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: sign-sums script
        run: bash scripts/sign-sums.sh --self-test
      - name: web build
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.22.2/trunk-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin trunk
          sh scripts/package-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: calendarcraft-web
          path: dist-release/

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: warn if code changed without a version bump
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE:Cargo.toml" 2>/dev/null; then
            echo "No Cargo.toml on the base commit; skipping."
            exit 0
          fi
          old=$(git show "$BASE:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          new=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$old" != "$new" ]; then
            echo "Version bumped: $old -> $new."
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(src/|tests/|scripts/|assets/|web/|Cargo\.(toml|lock))'; then
            echo "::warning file=Cargo.toml::Code changed but the version in Cargo.toml is still $new. Bump it if this should become a new release when merged."
          else
            echo "No code paths changed; version $new is unchanged, which is fine."
          fi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
