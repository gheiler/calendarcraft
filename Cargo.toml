[package]
name = "calendarcraft"
version = "0.3.0"
edition = "2021"
description = "Clean-room calendar app in Rust for macOS, WebAssembly, and MCP"

[lib]
name = "calendarcraft"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "calendarcraft"
path = "src/main.rs"

[[bin]]
name = "calendarcraft-mcp"
path = "src/bin/mcp_server.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
# Building blocks only (content lines, values, RRULE, VTIMEZONE). No egui, no ICU.
# Pin a commit: the repo does not publish this crate on crates.io.
craft-ical = { git = "https://github.com/storytold/craft-libs", rev = "dc2cb42b15676a6cf8a2b1f42fe29b261d1fa56d" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.37"
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "2.12"
pollster = "0.4"
keyring = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", features = ["serde", "clock", "wasmbind"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "Storage", "Request", "RequestInit", "RequestCredentials", "RequestRedirect", "Response", "Headers", "MessageEvent", "UrlSearchParams", "Navigator", "MediaQueryList", "Crypto", "CryptoKey", "SubtleCrypto", "AesKeyGenParams", "AesGcmParams", "Event", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "IdbObjectStoreParameters", "DomStringList", "IdbVersionChangeEvent"] }

[dev-dependencies]
# Reads the bundled font in tests/glyphs.rs (already in the tree through egui).
ab_glyph = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
